summary: >-
  The operational-transparency surface is essentially empty. SkipOdds publishes a versioned URI path
  and a terms-of-service effective date, and nothing else: no status page, no changelog or release
  notes, no deprecation or sunset policy, no public SLA, and no blog or roadmap. Several beta feeds are
  labelled as such in the docs, but there is no published statement of what beta means for stability.
