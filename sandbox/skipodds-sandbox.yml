    note: Self-serve, no card. The value is issued per user, so none is published.
usage:
  rest_example: 'curl https://skipodds.com/v1/fixtures -H "x-api-key: skipodds-demo-2026"'
  rest_example_preferred: 'curl https://skipodds.com/v1/fixtures -H "Authorization: Bearer skipodds-demo-2026"'
  mcp_example: >-
    Add {"mcpServers":{"skipodds":{"type":"streamable-http","url":"https://skipodds.com/mcp"}}} with no
    headers block to run anonymously on the demo quota.
  widget_example: '<div data-skipodds data-sport="soccer" data-limit="5"></div><script async src="https://skipodds.com/widget.js"></script>'
  widget_note: The embeddable widget requires no key at all — the lowest-friction evaluation path.
what_is_not_provided:
  - No separate sandbox host or base URL.
  - No test/live key prefixes distinguishing environments.
  - No fixture/trigger tooling to force a given match state or probability.
  - No time simulation or test clocks — line-movement history is real elapsed time only.
  - No way to test the webhook/alerts surface without a paid tier; alerts are paid-tier only and there is no simulated delivery.
