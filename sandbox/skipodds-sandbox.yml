summary: >-
  There is no separate sandbox or test environment. SkipOdds evaluates against PRODUCTION using a
  published shared demo key — the same host, the same data, the same endpoints, just a smaller daily
  quota. That is a deliberate design choice the provider states plainly: the demos "aren't mockups;
  they're production". There are no test fixtures, no mock ids, no time simulation, and no separate
  test-key prefix — a demo response and a paid response are byte-identical apart from the `tier` and
  `requests_remaining_today` fields.
model: production-with-demo-key
separate_host: false
separate_key_prefix: false
