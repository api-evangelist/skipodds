docs: https://skipodds.com/docs/limits
summary: >-
  Rate limiting is a single per-key DAILY request quota, set by billing tier. There is no per-second,
  per-minute or per-endpoint limit published, and no burst allowance. The runtime signal is unusual and
  worth an integrator's attention: SkipOdds returns NO RateLimit-* or X-RateLimit-* response headers
  and no Retry-After — the remaining allowance is carried in the RESPONSE BODY as
  `requests_remaining_today`, alongside a `tier` string. An agent that watches headers will see nothing;
  it has to read the body.
limit_count: 5
limits:
  - scope: per-key (shared demo key)
    tier: Demo
    window: 1 day
    limit: 100
    burst: null
    note: The demo key skipodds-demo-2026 is shared across all anonymous callers, including anonymous MCP callers.
  - scope: per-key
    tier: Free
    window: 1 day
    limit: 250
    burst: null
  - scope: per-key
    tier: Starter
    window: 1 day
    limit: 5000
    burst: null
  - scope: per-key
    tier: Pro
    window: 1 day
    limit: 50000
    burst: null
  - scope: per-key
    tier: Scale
    window: 1 day
    limit: 500000
    burst: null
