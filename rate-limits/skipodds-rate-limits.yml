    body: '{"error": "invalid_api_key"}'
other_limits:
  - kind: parameter cap
    detail: 'limit query parameter on fixture listings: 1–50, default 25 (OpenAPI declares only the default).'
  - kind: tiered lookback
    detail: >-
      Line-movement `hours` defaults to 24 and is capped at 72 on Demo/Free/Starter/Pro, 336 (14 days)
      on Scale. This is a tier-gated data window, not a request limit.
  - kind: webhook slots
    detail: Registered movement-alert webhooks — Starter 2, Pro 5, Scale 20. Endpoints failing 10 consecutive deliveries are deactivated.
  - kind: caching
    detail: Responses are cached ~60s (cache-control public, s-maxage=60, max-age=60), which bounds how fast a poller can see new data.
