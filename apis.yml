name: SkipOdds
description: >-
  SkipOdds is a sports-odds data API from SkipSeek Inc. that publishes de-vigged consensus win
  probabilities — the SkipOdds Index — across 13 sports: soccer, American football, basketball,
  baseball, hockey, college football, college basketball, tennis, golf, cricket, rugby, MMA and boxing.
  Every surveyed bookmaker price for a market is averaged and stripped of its margin so the returned
  probabilities sum to exactly 100%, with fair decimal odds, the number of books surveyed, and the
  margin removed carried alongside. The surface covers fixtures, tournament outrights, line movement
  over a configurable window, and threshold-triggered webhook alerts, and is offered three ways: a
  public OpenAPI 3.0.3 REST contract, an anonymous streamable-http MCP server, and a keyless
  embeddable widget. Data is informational only — no bets are taken, no funds held, and no bookmaker
  names exposed.
