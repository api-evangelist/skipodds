apis:
  - name: SkipOdds REST API
    description: >-
      API-key-authenticated REST API returning de-vigged consensus sports probabilities, fixtures,
      outrights, line movement, and webhook alerts across 13 sports. Public OpenAPI 3.0.3 contract with
      11 operations, served at https://skipodds.com/openapi.json. Authenticate with an
      `Authorization: Bearer` header (or the legacy `x-api-key` header) — never in the query string.
      Remaining daily quota is returned in the response body as `requests_remaining_today` rather than
      in rate-limit headers.
