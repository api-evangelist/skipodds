  - name: SkipOdds MCP Server
    description: >-
      Hosted Model Context Protocol server exposing the SkipOdds Index to AI assistants — stateless
      streamable-http at https://skipodds.com/mcp, protocol version 2025-06-18, five read-only tools
      (list_fixtures, get_fixture, get_fixture_movement, list_tournament_outrights,
      list_golf_tournaments). It answers `tools/list` and every tool with no credentials at all,
      falling back to the shared demo quota; a free personal key raises the limit and travels as a
      Bearer token.
